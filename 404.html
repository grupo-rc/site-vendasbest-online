<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Best">
<link rel="apple-touch-icon" href="thebest-icon-48.png">
<link rel="icon" href="thebest-icon-48.png">
<title>The Best • Atendimento</title>
<style>
:root{--bg:#0b1730;--top:#10264a;--panel:#0e1f3d;--in:#16305a;--out:#1f5fbf;--txt:#eaf1ff;--sub:#8fb3ec;--line:#1c2f52;--ok:#53bdeb;--chip:#14325f;--red:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--top);border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1f5fbf,#0b3a80);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.hn{font-weight:700}.hs{font-size:12.5px;color:var(--sub)}
#msgs{flex:1;overflow-y:auto;padding:12px 10px 6px;background-color:var(--bg);background-image:radial-gradient(rgba(143,179,236,.06) 1px,transparent 1px);background-size:18px 18px;overscroll-behavior:contain}
.day{text-align:center;margin:8px 0}.day span{background:var(--panel);color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px}
.row{display:flex;margin:3px 0}.row.me{justify-content:flex-end}
.b{max-width:82%;padding:6px 8px 4px 9px;border-radius:10px;background:var(--in);word-wrap:break-word;white-space:pre-wrap;position:relative;font-size:15.5px}
.me .b{background:var(--out)}.row:not(.me) .b{border-top-left-radius:3px}.me .b{border-top-right-radius:3px}
.meta{float:right;font-size:11px;color:rgba(234,241,255,.65);margin:6px 0 -2px 10px;display:flex;gap:3px;align-items:center}
.tk{font-size:13px;letter-spacing:-4px;margin-right:3px}.tk.lida{color:var(--ok)}
.b a{color:#9fd0ff}
.b img,.b video{display:block;max-width:100%;max-height:340px;border-radius:7px;margin:-2px -4px 4px -5px;background:#08122a}
.b audio{width:230px;max-width:100%;margin:2px 0}
.doc{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.18);padding:8px;border-radius:8px;text-decoration:none;color:var(--txt)}
.pix{margin-top:6px;width:100%;padding:9px;border-radius:8px;background:#0f9d58;font-weight:700;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 8px}
.chip{background:var(--chip);border:1px solid #2f5fa8;border-radius:18px;padding:7px 12px;font-size:14px}
.chip.ativar{background:#25d366;border-color:#25d366;color:#04210f;font-weight:700;font-size:15px;padding:10px 16px}
.typing{display:none;padding:2px 12px 4px}.typing.on{display:block}
.dots{display:inline-flex;gap:4px;background:var(--in);padding:10px 12px;border-radius:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:d 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
footer{display:flex;align-items:flex-end;gap:6px;padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.box{flex:1;display:flex;align-items:flex-end;background:var(--top);border-radius:24px;padding:4px 6px;min-height:46px}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--sub);flex:none}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--txt);font:inherit;font-size:16px;max-height:120px;padding:9px 4px;line-height:1.3}
.send{width:48px;height:48px;border-radius:50%;background:var(--out);display:grid;place-items:center;flex:none;color:#fff}
.send.rec{background:var(--red)}
svg{width:24px;height:24px;fill:currentColor}
#emoji{display:none;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:var(--panel);border-top:1px solid var(--line);max-height:190px;overflow:auto}
#emoji.on{display:grid}#emoji button{font-size:26px;padding:4px}
#recbar{display:none;flex:1;align-items:center;gap:10px;background:var(--top);border-radius:24px;padding:0 14px;min-height:46px;color:var(--txt)}
#recbar.on{display:flex}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:d 1s infinite}
#start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
#start.hide{display:none}
.card{width:100%;max-width:380px;text-align:center}
.logo{width:84px;height:84px;border-radius:24px;margin:0 auto 16px;background:linear-gradient(135deg,#1f5fbf,#0b3a80);display:grid;place-items:center;font-size:30px;font-weight:900;letter-spacing:1px}
.card h1{margin:0 0 6px;font-size:24px}.card p{margin:0 0 20px;color:var(--sub)}
.card input{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid #2a4777;background:var(--top);color:var(--txt);font-size:16px;outline:0}
.card input:focus{border-color:#4f8fe8}
.cta{width:100%;padding:15px;border-radius:12px;background:#25b864;color:#fff;font-weight:800;font-size:17px;margin-top:4px}
.cta:disabled{opacity:.6}.err{color:#ff9aa4;font-size:14px;min-height:20px;margin:4px 0}.fine{font-size:12.5px;color:var(--sub);margin-top:14px}
.bul{display:flex;justify-content:center;gap:14px;margin:0 0 20px;font-size:13px;color:var(--sub)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}
#zoom.on{display:flex}#zoom img{max-width:100%;max-height:100%}
.pend{opacity:.7}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:18px;font-size:14px;display:none;z-index:8}
.wa{display:none;align-items:center;gap:10px;margin:6px 10px;padding:12px 14px;border-radius:14px;background:#25d366;color:#04210f;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}.wa.on{display:flex}.wa svg{width:24px;height:24px;flex:none;fill:currentColor}
</style>
</head>
<body>
<div id="app">
  <header><div class="av">TB</div><div><div class="hn">The Best</div><div class="hs" id="status">online</div></div></header>
  <div id="msgs" aria-live="polite"></div>
  <div class="typing" id="typing"><span class="dots"><i></i><i></i><i></i></span></div>
  <div class="chips" id="chips"></div>
  <a class="wa" id="wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6 0l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg><span>Plano ativado! Toque aqui para falar com a gente no WhatsApp</span></a>
  <div id="emoji"></div>
  <footer>
    <div class="box" id="box">
      <button class="ib" id="bEmoji" aria-label="Emojis"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 17.5c2.3 0 4.3-1.4 5.1-3.5H6.9c.8 2.1 2.8 3.5 5.1 3.5z"/></svg></button>
      <textarea id="txt" rows="1" placeholder="Mensagem" enterkeyhint="send"></textarea>
      <button class="ib" id="bClip" aria-label="Enviar foto, vídeo ou arquivo"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg></button>
      <button class="ib" id="bCam" aria-label="Câmera"><svg viewBox="0 0 24 24"><path d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4zM9 2 7.2 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.2L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>
    </div>
    <div id="recbar"><span class="dot"></span><span id="rect">0:00</span><span style="flex:1;color:var(--sub);font-size:14px">Gravando…</span><button id="bCancel" style="color:var(--red);font-weight:700">Cancelar</button></div>
    <button class="send" id="bSend" aria-label="Gravar áudio"></button>
  </footer>
</div>
<input type="file" id="fFile" accept="image/*,video/*,audio/*,application/pdf" hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<div id="zoom"><img alt=""></div>
<div class="toast" id="toast"></div>
<div id="start">
  <div class="card">
    <div class="logo">TB</div>
    <h1>Atendimento The Best</h1>
    <p>Fale com a gente agora e receba seu <b>teste grátis</b> na hora.</p>
    <div class="bul"><span>⚡ Resposta na hora</span><span>📺 Todos os aparelhos</span></div>
    <input id="iNome" placeholder="Seu nome" autocomplete="given-name" maxlength="60">
    <input id="iTel" placeholder="Seu WhatsApp com DDD" inputmode="tel" autocomplete="tel" maxlength="20">
    <div class="err" id="err"></div>
    <button class="cta" id="bStart">Iniciar conversa</button>
    <div class="fine">Seu WhatsApp é usado só para enviar seu acesso e avisos do seu plano.</div>
  </div>
</div>
<script>
(() => {
const API = 'https://lsixmbsiptgznzsucyrn.supabase.co/functions/v1/chat-site'; // trocado pelo build (scripts/build-web.mjs) pelo endereco do ambiente
const CONTA = new URLSearchParams(location.search).get('c') || 'vendasbest';
const KEY = 'tb_chat_' + CONTA;
const $ = id => document.getElementById(id);
const IC = {
  send: '<svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>',
  mic: '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9h-2z"/></svg>',
};
let lastState = null, token = null, msgs = [], pend = [], lastSig = '', timer = null, recState = null, lastTyping = 0, unseen = 0, firstLoad = true;
try { token = localStorage.getItem(KEY); } catch {}

async function api(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch {}
  if (!j || !j.ok) { const e = new Error((j && j.error) || 'FALHA'); e.status = r.status; throw e; }
  return j;
}
const chave = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9-]/g, '').slice(0, 40);
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2600); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(t) {
  let h = esc(t);
  h = h.replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  h = h.replace(/(^|[\s(])\*([^*\n]{1,200})\*(?=[\s).,!?:;]|$)/g, '$1<b>$2</b>').replace(/(^|[\s(])_([^_\n]{1,200})_(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>');
  return h;
}
const hora = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const dia = iso => { const d = new Date(iso), h = new Date(); const y = new Date(); y.setDate(h.getDate() - 1);
  if (d.toDateString() === h.toDateString()) return 'Hoje'; if (d.toDateString() === y.toDateString()) return 'Ontem';
  return d.toLocaleDateString('pt-BR'); };
const ehPix = t => /^000201[0-9A-Za-z .:/@*\-]{40,}$/.test(String(t || '').trim());

function bubble(m, lida) {
  const me = m.de === 'cliente';
  let corpo = '';
  if (m.tipo === 'image' && m.url) corpo += `<img src="${esc(m.url)}" loading="lazy" data-z="1" alt="">`;
  else if (m.tipo === 'video' && m.url) corpo += `<video src="${esc(m.url)}" controls playsinline preload="metadata"></video>`;
  else if (m.tipo === 'audio' && m.url) corpo += `<audio src="${esc(m.url)}" controls preload="metadata"></audio>`;
  else if (m.tipo === 'document' && m.url) corpo += `<a class="doc" href="${esc(m.url)}" target="_blank" rel="noopener">📄 <span>${esc(m.nomeArquivo || 'Arquivo')}</span></a>`;
  else if (m.tipo !== 'text' && !m.url) corpo += `<i style="color:var(--sub)">${m.pend ? 'Enviando arquivo…' : 'Arquivo'}</i>`;
  if (m.texto) corpo += (corpo ? '<div style="margin-top:4px"></div>' : '') + fmt(m.texto);
  if (!me && ehPix(m.texto)) corpo += `<button class="pix" data-pix="${esc(m.texto.trim())}">Copiar código Pix</button>`;
  const tk = me ? (m.pend ? '<span class="tk">🕓</span>' : `<span class="tk${lida ? ' lida' : ''}">✓✓</span>`) : '';
  return `<div class="row${me ? ' me' : ''}"><div class="b${m.pend ? ' pend' : ''}">${corpo}<span class="meta">${hora(m.quando)}${tk}</span></div></div>`;
}

function render(st) {
  if (st) lastState = st; else st = lastState;
  const box = $('msgs');
  const perto = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const todas = msgs.concat(pend.filter(p => !msgs.some(m => m.id === p.id)));
  let h = '', d = '';
  // Lida = a loja respondeu depois da mensagem do cliente.
  let ultimaLoja = 0; for (const m of todas) if (m.de !== 'cliente') ultimaLoja = Math.max(ultimaLoja, Date.parse(m.quando));
  for (const m of todas) {
    const dd = dia(m.quando); if (dd !== d) { h += `<div class="day"><span>${dd}</span></div>`; d = dd; }
    h += bubble(m, Date.parse(m.quando) <= ultimaLoja);
  }
  box.innerHTML = h;
  if (perto || firstLoad) box.scrollTop = box.scrollHeight;
  firstLoad = false;
  $('typing').classList.toggle('on', Boolean(st && st.digitando));
  $('status').textContent = st && st.digitando ? 'digitando…' : 'online';
  chips(todas);
}

function chips(todas) {
  const el = $('chips'); el.innerHTML = '';
  const ult = todas[todas.length - 1];
  // Botão "Quero ativar" (Roberto 28/10 21:42): depois que o teste chegou (o robô mandou usuário e senha) e enquanto o
  // plano não foi pago. Manda o mesmo texto que o cliente digitaria; os planos e o Pix continuam saindo pelo robô da revenda.
  const teste = todas.some(m => m.de !== 'cliente' && m.texto && /usu[aá]rio/i.test(m.texto) && /senha/i.test(m.texto)
    && !/renovado com sucesso|ativado com sucesso/i.test(m.texto));
  const pago = Boolean(lastState && lastState.whatsapp);
  const ativar = () => { if (!teste || pago) return; const b = document.createElement('button'); b.className = 'chip ativar';
    b.textContent = '✅ Quero ativar meu plano'; b.onclick = () => enviarTexto('Quero ativar'); el.appendChild(b); };
  if (!ult || ult.de === 'cliente' || !ult.texto) { if (ult && ult.de !== 'cliente') ativar(); return; }
  const ops = [];
  for (const linha of ult.texto.split('\n')) {
    const m = linha.match(/^\s*\*?(\d{1,2})(?:\uFE0F?\u20E3|\s*[-–—.)]|\s*[:=])\s*\*?\s*(.{1,40})$/);
    // Linha numerada que é só telefone (ex.: "1️⃣+5515…" do suporte) não é opção de menu.
    if (m && !/^\+?[\d\s().-]{8,}$/.test(m[2].replace(/\*/g, '').trim())) ops.push({ v: m[1], l: `${m[1]} • ${m[2].replace(/\*/g, '').trim()}` });
  }
  if (/\bPRONTO\b/.test(ult.texto) && !ops.length) ops.push({ v: 'PRONTO', l: 'PRONTO' });
  if (/responda\s+\*?sim\*?/i.test(ult.texto) && !ops.length) { ops.push({ v: 'SIM', l: 'SIM' }); ops.push({ v: 'NÃO', l: 'NÃO' }); }
  for (const o of ops.slice(0, 12)) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = o.l; b.onclick = () => enviarTexto(o.v); el.appendChild(b); }
  if (!ops.length) ativar();
}

async function ler() {
  if (!token) return;
  try {
    const r = await api({ acao: 'ler', token });
    const sig = JSON.stringify([r.mensagens.map(m => m.id), r.digitando]);
    const novasLoja = r.mensagens.filter(m => m.de !== 'cliente' && !msgs.some(x => x.id === m.id)).length;
    msgs = r.mensagens;
    pend = pend.filter(p => !p.id || !msgs.some(m => m.id === p.id));
    if (sig !== lastSig) { lastSig = sig; render(r); }
    const wa = $('wa'); if (r.whatsapp && /^https:\/\/wa\.me\/\d+\?text=/.test(r.whatsapp)) { wa.href = r.whatsapp; wa.classList.add('on'); lastState = r; document.querySelectorAll('.chip.ativar').forEach(x => x.remove()); let ja = false; try { ja = localStorage.getItem('tb_wa_' + token) === '1'; } catch {} if (!ja) { try { localStorage.setItem('tb_wa_' + token, '1'); } catch {} const sp = wa.querySelector('span'), padrao = sp.textContent; let n = 6; const passo = () => { if (n > 0) { sp.textContent = `Pagamento confirmado! ✅ Aguarde, vamos te levar para o nosso WhatsApp em ${n}…`; n--; setTimeout(passo, 1000); } else { sp.textContent = padrao; location.href = r.whatsapp; } }; passo(); } } else { wa.removeAttribute('href'); wa.classList.remove('on'); }
    if (novasLoja && !firstLoad && document.hidden) { unseen += novasLoja; document.title = `(${unseen}) Nova mensagem • The Best`; bip(); }
  } catch (e) {
    if (e.message === 'SESSAO_CHAT_INVALIDA') { try { localStorage.removeItem(KEY); } catch {} token = null; $('start').classList.remove('hide'); }
  }
}
function agendar() { clearTimeout(timer); timer = setTimeout(async () => { await ler(); agendar(); }, document.hidden ? 12000 : 2500); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { unseen = 0; document.title = 'The Best • Atendimento'; ler(); } agendar(); });
function bip() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .05; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .12); navigator.vibrate && navigator.vibrate(60); } catch {} }

async function enviarTexto(texto) {
  texto = String(texto || '').trim(); if (!texto || !token) return;
  const k = chave(); const p = { id: null, k, de: 'cliente', tipo: 'text', texto, quando: new Date().toISOString(), pend: true };
  pend.push(p); render(); $('msgs').scrollTop = $('msgs').scrollHeight;
  for (let i = 0; i < 3; i++) {
    try { const r = await api({ acao: 'enviar', token, chave: k, texto }); p.id = r.id || null; p.pend = false; await ler(); return; }
    catch (e) { if (e.status && e.status < 500 && e.status !== 429) break; await new Promise(r => setTimeout(r, 1200 * (i + 1))); }
  }
  pend = pend.filter(x => x !== p); render(); toast('Não foi enviado. Tente de novo.');
}

async function enviarArquivo(file, legenda = '') {
  if (!file || !token) return;
  const base = String(file.type || '').split(';')[0].toLowerCase();
  const tipo = base.startsWith('image/') ? 'image' : base.startsWith('video/') ? 'video' : base.startsWith('audio/') ? 'audio' : base === 'application/pdf' ? 'document' : '';
  if (!tipo) return toast('Esse tipo de arquivo não é aceito.');
  if (file.size > 50 * 1024 * 1024) return toast('Arquivo muito grande (máx. 50 MB).');
  const local = URL.createObjectURL(file);
  const p = { id: null, de: 'cliente', tipo, texto: legenda, url: local, nomeArquivo: file.name, quando: new Date().toISOString(), pend: true };
  pend.push(p); render(); $('msgs').scrollTop = $('msgs').scrollHeight;
  try {
    const u = await api({ acao: 'urlEnvio', token, mime: base, tamanho: file.size });
    const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', new Blob([file], { type: base }), file.name || 'arquivo');
    const up = await fetch(u.url, { method: 'PUT', body: fd, headers: { 'x-upsert': 'false' } });
    if (!up.ok) throw new Error('UPLOAD');
    const r = await api({ acao: 'enviar', token, chave: chave(), texto: legenda, midia: { caminho: u.caminho, mime: base, nome: file.name || '' } });
    p.id = r.id || null; p.pend = false; await ler();
  } catch { pend = pend.filter(x => x !== p); render(); toast('Não foi possível enviar o arquivo.'); }
}

// ---------- composer
const txt = $('txt'), bSend = $('bSend');
function botao() { const tem = txt.value.trim().length > 0; bSend.innerHTML = tem ? IC.send : IC.mic; bSend.setAttribute('aria-label', tem ? 'Enviar' : 'Gravar áudio'); }
txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 120) + 'px'; botao();
  if (token && Date.now() - lastTyping > 4000) { lastTyping = Date.now(); api({ acao: 'digitando', token }).catch(() => {}); } });
txt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); mandar(); } });
function mandar() { const t = txt.value; txt.value = ''; txt.style.height = 'auto'; botao(); enviarTexto(t); txt.focus(); }
bSend.addEventListener('click', () => { if (recState) return pararGravacao(true); if (txt.value.trim()) return mandar(); gravar(); });
$('bClip').onclick = () => $('fFile').click();
$('bCam').onclick = () => $('fCam').click();
$('fFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; enviarArquivo(f, ''); };
$('fCam').onchange = e => { const f = e.target.files[0]; e.target.value = ''; enviarArquivo(f, ''); };
const EMOJIS = '😀 😂 😍 🥰 😎 🤩 😉 😅 🙏 👍 👏 🙌 💪 🔥 ✅ ❤️ 💙 🎉 ⚽ 🏆 📺 📱 💻 🎬 🍿 🤔 😮 😢 😡 👀 💰 ⏰ 📍 ✌️ 👋 🤝 💯 🆗 ❓ ‼️'.split(' ');
$('emoji').innerHTML = EMOJIS.map(e => `<button type="button">${e}</button>`).join('');
$('emoji').onclick = e => { if (e.target.tagName !== 'BUTTON') return; const s = txt.selectionStart ?? txt.value.length; txt.value = txt.value.slice(0, s) + e.target.textContent + txt.value.slice(s); botao(); };
$('bEmoji').onclick = () => $('emoji').classList.toggle('on');
$('msgs').addEventListener('click', async e => {
  const z = e.target.closest('[data-z]'); if (z) { $('zoom').querySelector('img').src = z.src; $('zoom').classList.add('on'); return; }
  const px = e.target.closest('[data-pix]'); if (px) { try { await navigator.clipboard.writeText(px.dataset.pix); toast('Código Pix copiado! Cole no app do seu banco.'); } catch { toast('Segure o código para copiar.'); } }
  $('emoji').classList.remove('on');
});
$('zoom').onclick = () => $('zoom').classList.remove('on');

// ---------- áudio
async function gravar() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Seu navegador não grava áudio. Escreva sua mensagem.');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const tipos = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'];
    const mime = tipos.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const partes = []; rec.ondataavailable = e => e.data.size && partes.push(e.data);
    const ini = Date.now();
    recState = { rec, stream, partes, ini, enviar: false, iv: setInterval(() => { const s = Math.floor((Date.now() - ini) / 1000); $('rect').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s >= 300) pararGravacao(true); }, 300) };
    rec.onstop = () => {
      const st = recState; recState = null; clearInterval(st.iv); st.stream.getTracks().forEach(t => t.stop());
      $('recbar').classList.remove('on'); $('box').style.display = ''; bSend.classList.remove('rec'); botao();
      if (!st.enviar || Date.now() - st.ini < 700) return;
      const base = (rec.mimeType || mime || 'audio/webm').split(';')[0];
      const ext = base.includes('mp4') ? 'm4a' : base.includes('ogg') ? 'ogg' : 'webm';
      enviarArquivo(new File(partes, `audio.${ext}`, { type: base }));
    };
    rec.start(); $('box').style.display = 'none'; $('recbar').classList.add('on'); bSend.classList.add('rec'); bSend.innerHTML = IC.send;
  } catch { toast('Libere o microfone para gravar áudio.'); }
}
function pararGravacao(enviar) { if (!recState) return; recState.enviar = enviar; try { recState.rec.stop(); } catch {} }
$('bCancel').onclick = () => pararGravacao(false);

// ---------- início
function origem() {
  const q = new URLSearchParams(location.search), o = {};
  for (const k of ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid', 'ad_id', 'adset_id', 'campaign_id']) if (q.get(k)) o[k] = q.get(k);
  if (document.referrer) o.referrer = document.referrer.slice(0, 300);
  return o;
}
$('iTel').addEventListener('input', e => { let d = e.target.value.replace(/\D/g, ''); if (d.length > 11 && d.startsWith('55')) d = d.slice(2); d = d.slice(0, 11);
  e.target.value = d.length > 7 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d; });
$('bStart').onclick = async () => {
  const nome = $('iNome').value.trim(), tel = $('iTel').value.replace(/\D/g, '');
  $('err').textContent = '';
  if (nome.length < 2) return $('err').textContent = 'Digite seu nome.';
  if (tel.length < 10) return $('err').textContent = 'Digite seu WhatsApp com DDD.';
  $('bStart').disabled = true; $('bStart').textContent = 'Abrindo…';
  try {
    const r = await api({ acao: 'iniciar', conta: CONTA, dominio: location.hostname, nome, telefone: tel, origem: origem() });
    if (r.jaCliente) {
      $('err').textContent = '';
      document.querySelector('.card').innerHTML = '<div class="logo">TB</div><h1>Você já é cliente The Best 💙</h1><p>Este canal é só para novos clientes. Para qualquer atendimento, fale com a gente pelo nosso WhatsApp de sempre ou pelo aplicativo.</p>';
      return;
    }
    token = r.token; try { localStorage.setItem(KEY, token); } catch {}
    $('start').classList.add('hide'); botao(); agendar();
    await enviarTexto('Olá! Gostaria de mais informações.');
  } catch (e) {
    $('err').textContent = e.message === 'TELEFONE_INVALIDO' ? 'Confira o número com DDD.' : e.message === 'MUITAS_TENTATIVAS' ? 'Muitas tentativas. Aguarde um pouco.' : 'Não foi possível abrir agora. Tente de novo.';
  } finally { $('bStart').disabled = false; $('bStart').textContent = 'Iniciar conversa'; }
};
botao();
if (token) { $('start').classList.add('hide'); ler().then(agendar); }
})();
</script>
